<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santes Mod</title>  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 32px;
    }

    .codigo {
      display: inline-block;
      padding: 18px 25px;
      background: #222;
      border: 1px solid #444;
      border-radius: 12px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .codigo:active {
      transform: scale(0.96);
    }

    #mensagem {
      margin-top: 15px;
      color: #00ff88;
      font-size: 16px;
      min-height: 20px;
    }
  </style></head><body>  <div class="container">
    <h1>Santes Mod</h1><div class="codigo" onclick="copiarCodigo()">
  DASH-NGIW-PC3Y
</div>

<div id="mensagem"></div>

  </div>  <script>
    function copiarCodigo() {
      const codigo = "DASH-NGIW-PC3Y";

      navigator.clipboard.writeText(codigo).then(() => {
        document.getElementById("mensagem").textContent =
          "Código copiado!";
      });
    }
  </script></body>
</html>
