<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santes GX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b0f;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 25px;
      color: #ffffff;
      text-shadow: 0 0 15px #7c3cff;
    }

    .key-panel {
      padding: 25px;
      border-radius: 18px;
      background: #15151d;
      border: 1px solid #713cff;
      box-shadow: 0 0 25px rgba(113, 60, 255, 0.35);
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }

    .key-panel:hover {
      transform: scale(1.03);
      box-shadow: 0 0 35px rgba(113, 60, 255, 0.55);
    }

    .key {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hint {
      margin-top: 12px;
      color: #aaa;
      font-size: 14px;
    }

    #status {
      margin-top: 18px;
      color: #9b75ff;
      font-size: 15px;
      height: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Santes GX</h1>

    <div class="key-panel" onclick="copiarKey()">
      <div class="key">DASH-DWDT-4ZQG</div>
      <div class="hint">Clique para copiar a key</div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    function copiarKey() {
      const key = "DASH-DWDT-4ZQG";

      navigator.clipboard.writeText(key).then(() => {
        document.getElementById("status").textContent =
          "✓ Key copiada!";
        
        setTimeout(() => {
          document.getElementById("status").textContent = "";
        }, 2000);
      });
    }
  </script>

</body>
</html>
